modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''ИИ-бог «Живого мира»: следит за событиями, слышит молитвы (вслух, в чате, у алтаря) и вмешивается — знамения, благословения, дары, мягкие проклятия. Решения принимает LLM через брокер, исполняются только действия из белого списка. Только для сервера.'''
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecolonies"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "livingvoice"
type = "optional"
versionRange = "[1.0.4,)"
ordering = "AFTER"
side = "BOTH"
