modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''Клиентские правки «Живого мира»: озвучку жителей MCA слышно вдвое дальше (без прибавки громкости вблизи). Только для клиента.'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "mca"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"
