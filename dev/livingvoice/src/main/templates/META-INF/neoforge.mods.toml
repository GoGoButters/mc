modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''Голосовые разговоры с жителями MCA и колонистами Living Colonists через Simple Voice Chat: речь игрока -> распознавание -> тот, на кого он смотрит; колонисты отвечают голосом. Только для сервера.'''
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "voicechat"
type = "required"
versionRange = "[1.21.1-2.6,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mca"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "livingcolonists"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
