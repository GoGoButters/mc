modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''Правки Immersive Aircraft для «Живого мира»: винтокрыл летает на топливе из котла вместо сытости пилота; жидкое топливо заливается из неполных ёмкостей и ёмкостей меньше ведра. Нужен на сервере и клиенте.'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "immersive_aircraft"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
