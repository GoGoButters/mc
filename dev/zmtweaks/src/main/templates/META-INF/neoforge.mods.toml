modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''Правки модов для «Живого мира». Immersive Aircraft: винтокрыл — вертолёт с ДВС на топливе из котла (мгновенный запуск по подъёму, мотор вдвое тише, дым выхлопа) и психологическим оружием (левый Ctrl: «Полёт валькирий», слышно до 150 блоков); у всей авиации внутренний бак на 10 000 мБ с индикатором в окне машины; жидкое топливо заливается из неполных ёмкостей и ёмкостей меньше ведра. Mekanism: фабрики всех уровней тратят вдвое больше энергии на линию и имеют вдвое больший буфер. Нужен на сервере и клиенте.'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[mixins]]
config = "${mod_id}.nedologin.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "immersive_aircraft"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "mekanism"
type = "required"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
